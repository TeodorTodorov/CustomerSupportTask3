[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klett-classifier"
version = "3.0.1"
description = "Secure bilingual educational support query classifier"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.3,<3",
    "transformers==4.57.6",
    "accelerate>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "sentencepiece>=0.2,<1",
    "protobuf>=4.25,<7",
    "huggingface-hub==0.36.2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
data = ["datasets==3.6.0", "sacremoses>=0.1.1,<1"]
leakage = [
    "datasketch>=1.6,<2",
    "sentence-transformers>=3.0,<6",
    "hnswlib>=0.8,<1",
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
klett = "klett_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
